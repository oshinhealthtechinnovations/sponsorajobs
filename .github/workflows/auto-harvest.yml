name: Automated Job Extraction & Ingestion Pipeline

on:
  schedule:
    # Runs automatically twice every day at 00:00 UTC and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime with 1 click

jobs:
  harvest-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing the updated dataset

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Live API Extraction & Harvesting Pipeline
        env:
          ENABLE_ATS: "true"
          ENABLE_ARBEITNOW: "true"
          ENABLE_REMOTEOK: "true"
          ENABLE_JOBICY: "true"
          ENABLE_HIMALAYAS: "true"
          ENABLE_THEMUSE: "true"
          ENABLE_REMOTIVE: "true"
          ENABLE_JOOBLE: "true"
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY || 'cfc868f0-452d-42fc-8b06-6df99d9bc074' }}
          ENABLE_USAJOBS: "true"
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL || 'oshinhealthtechinnovations@gmail.com' }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY || 'tTjBDekl7VpbMyoaAJEDasI3+W44QV7DQ2ZO7lIpplY=' }}
          ENABLE_ADZUNA: "true"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID || 'ba1d34a6' }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY || '478146c510d2762286ad442bd9414644' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8728617267:AAHahZaci_FgFjRQpgmpyCZYV7D_gX3ZX40' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8569757426' }}
        run: npx tsx scripts/harvest-real-jobs.ts

      - name: Commit and push updated job dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if realJobsData.json was modified
          if [ -n "$(git status --porcelain lib/db/realJobsData.json)" ]; then
            git add lib/db/realJobsData.json
            git commit -m "chore(auto-harvest): automated live jobs ingestion $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
            echo "New jobs successfully pushed to main!"
          else
            echo "No new jobs detected in this cycle."
          fi
