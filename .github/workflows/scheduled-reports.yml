name: Automated Hourly & Morning Executive Reports

on:
  schedule:
    # Hourly runner on the hour (e.g., 01:00, 02:00, 03:00 UTC...)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to dispatch'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hourly
          - daily

jobs:
  dispatch-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --prefer-offline --no-audit

      - name: Determine dispatch mode and execute report
        continue-on-error: true
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'sumit@sponsorajobs.com' }}
          DOMAIN_SMTP_HOST: ${{ secrets.DOMAIN_SMTP_HOST || 'mail.sponsorajobs.com' }}
          DOMAIN_SMTP_PORT: ${{ secrets.DOMAIN_SMTP_PORT || '587' }}
          DOMAIN_SMTP_USER: ${{ secrets.DOMAIN_SMTP_USER || 'support@sponsorajobs.com' }}
          DOMAIN_SMTP_PASS: ${{ secrets.DOMAIN_SMTP_PASS || 'Os@626461' }}
          DOMAIN_ADMIN_EMAIL: ${{ secrets.DOMAIN_ADMIN_EMAIL || 'sumit@sponsorajobs.com' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'oshinhealthtechinnovations@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'kltldstgpmpvhdnm' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://tyijulgmluvlxkfgsszd.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_bjRsLme6-pwayZBk95Kikw_d6_lexjm' }}
          NEXT_PUBLIC_SITE_URL: 'https://sponsorajobs.com'
          NODE_ENV: 'production'
        run: |
          # If manual dispatch, use user selected input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="--${{ github.event.inputs.report_type }}"
          else
            # Check current hour UTC (02:00 UTC = 07:30 AM IST is morning daily report window)
            CURRENT_HOUR=$(date -u +'%H')
            if [ "$CURRENT_HOUR" = "02" ]; then
              MODE="--all"
            else
              MODE="--hourly"
            fi
          fi

          echo "Executing report dispatch with mode: $MODE"
          npx tsx scripts/dispatch-scheduled-reports.ts $MODE || echo "[Warning] Report dispatch completed with non-zero exit — email service may need RESEND_API_KEY or SMTP_PASS secrets configured."

      - name: Report Status
        run: echo "Scheduled report job completed at $(date -u +'%Y-%m-%d %H:%M UTC')"
