name: Autonomous SEO Engine & Search Engine Indexing

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      cycle_mode:
        description: 'SEO Cycle Execution Mode'
        required: true
        default: 'full-cycle'
        type: choice
        options:
          - full-cycle
          - dry-run
      send_notification:
        description: 'Dispatch executive email report'
        required: true
        default: true
        type: boolean

jobs:
  seo-automation-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Autonomous SEO Cycle
        env:
          NEXT_PUBLIC_SITE_URL: "https://sponsorajobs.com"
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY || 'sponsorajobs2026seo' }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.cycle_mode }}" = "dry-run" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.send_notification }}" = "false" ]; then
            ARGS="$ARGS --no-notify"
          fi
          
          echo "Triggering Autonomous SEO Engine with args: $ARGS"
          npx tsx scripts/run-seo-automation.ts $ARGS
